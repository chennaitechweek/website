name: Validate city site
on:
  pull_request:
  push:
    branches: [main, stage]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-core.mjs --release
      - run: npm run build
      - run: npm run validate
